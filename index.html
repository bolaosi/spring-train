<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#8eb9e0">
    <meta name="description" content="一幅由参数实时驱动的春日山林景观。">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <title>春野 · 动态山林</title>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="experience" id="experience" aria-label="春日山林动态景观">
      <div class="landscape-stage" aria-hidden="true">
        <svg class="landscape" viewBox="0 0 1252 576" preserveAspectRatio="none" role="img" aria-label="层层春绿山林、云朵、河面与横跨景观的钢索桥">
          <defs>
            <linearGradient id="sky-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="sky-stop-top" offset="0%"></stop>
              <stop class="sky-stop-middle" offset="56%"></stop>
              <stop class="sky-stop-horizon" offset="100%"></stop>
            </linearGradient>
            <radialGradient id="morning-glow" cx="50%" cy="50%" r="50%">
              <stop class="glow-stop-core" offset="0%"></stop>
              <stop class="glow-stop-edge" offset="100%"></stop>
            </radialGradient>
            <linearGradient id="distant-mountain-gradient" x1="0" y1="0" x2="0.1" y2="1">
              <stop class="mountain-far-top" offset="0%"></stop>
              <stop class="mountain-far-bottom" offset="100%"></stop>
            </linearGradient>
            <linearGradient id="near-mountain-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="mountain-near-top" offset="0%"></stop>
              <stop class="mountain-near-bottom" offset="100%"></stop>
            </linearGradient>
            <linearGradient id="forest-0-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="forest-0-top" offset="0%"></stop><stop class="forest-0-bottom" offset="100%"></stop>
            </linearGradient>
            <linearGradient id="forest-1-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="forest-1-top" offset="0%"></stop><stop class="forest-1-bottom" offset="100%"></stop>
            </linearGradient>
            <linearGradient id="forest-2-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="forest-2-top" offset="0%"></stop><stop class="forest-2-bottom" offset="100%"></stop>
            </linearGradient>
            <linearGradient id="forest-3-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="forest-3-top" offset="0%"></stop><stop class="forest-3-bottom" offset="100%"></stop>
            </linearGradient>
            <linearGradient id="forest-4-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="forest-4-top" offset="0%"></stop><stop class="forest-4-bottom" offset="100%"></stop>
            </linearGradient>
            <linearGradient id="water-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="water-stop-top" offset="0%"></stop>
              <stop class="water-stop-bottom" offset="100%"></stop>
            </linearGradient>
            <linearGradient id="bridge-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop class="bridge-stop-top" offset="0%"></stop>
              <stop class="bridge-stop-bottom" offset="100%"></stop>
            </linearGradient>
            <filter id="forest-soft" x="-12%" y="-18%" width="124%" height="136%" color-interpolation-filters="sRGB">
              <feTurbulence id="forest-noise" type="fractalNoise" baseFrequency="0.012 0.034" numOctaves="2" seed="19" result="noise"></feTurbulence>
              <feDisplacementMap id="forest-displace" in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G" result="displaced"></feDisplacementMap>
              <feGaussianBlur id="forest-blur" in="displaced" stdDeviation="1.35"></feGaussianBlur>
            </filter>
            <filter id="mountain-soft" x="-8%" y="-12%" width="116%" height="124%" color-interpolation-filters="sRGB">
              <feGaussianBlur id="mountain-blur" stdDeviation="0.8"></feGaussianBlur>
            </filter>
            <filter id="train-soft" x="-12%" y="-20%" width="124%" height="140%">
              <feGaussianBlur stdDeviation="0.22"></feGaussianBlur>
            </filter>
          </defs>

          <g id="camera">
            <g id="world">
              <rect class="sky" x="-40" y="-40" width="1332" height="680"></rect>
              <ellipse class="sun-wash" cx="230" cy="98" rx="250" ry="170"></ellipse>
              <circle class="sun" cx="230" cy="100" r="31"></circle>
              <circle class="sun-core" cx="230" cy="100" r="19"></circle>

              <g class="cloud-field" id="clouds-far">
                <path class="cloud cloud--far" d="M-85 165c17-30 53-35 76-14 11-41 60-55 91-27 25-18 61-3 63 28 32 2 43 37 16 52H-59c-34-4-44-25-26-39Z"></path>
                <path class="cloud cloud--far" d="M315 105c15-27 49-29 69-10 8-35 52-47 78-22 22-16 53-2 55 25 28 2 38 32 14 45H338c-30-3-40-22-23-38Z"></path>
                <path class="cloud cloud--far" d="M855 145c17-31 57-33 79-12 10-40 59-53 87-25 25-17 57 0 59 28 30 3 41 38 14 51H883c-34-4-44-25-28-42Z"></path>
                <path class="cloud cloud--far" d="M1130 72c13-24 43-25 59-9 8-31 43-43 66-21 20-14 47-1 49 23 24 2 33 29 12 41h-166c-26-3-34-20-20-34Z"></path>
              </g>
              <g class="cloud-field" id="clouds-near">
                <path class="cloud cloud--near" d="M-20 232c15-27 50-30 70-11 9-37 54-49 81-22 22-16 53-2 55 27 28 2 38 34 13 47H7c-30-4-40-23-27-41Z"></path>
                <path class="cloud cloud--near" d="M560 188c16-28 51-30 70-11 9-38 54-50 82-23 23-16 54-2 56 28 28 3 39 35 13 48H588c-31-4-40-24-28-42Z"></path>
                <path class="cloud cloud--near" d="M1030 238c14-25 45-28 63-10 8-34 47-45 72-22 21-14 48-1 50 24 25 2 34 31 12 43h-178c-28-3-36-21-19-35Z"></path>
              </g>

              <path id="mountain-far" class="mountain mountain--far" d="M-40 350 36 302 90 319 160 270 228 300 302 244 369 295 450 235 526 290 605 224 676 288 755 238 826 290 900 245 980 298 1060 240 1132 288 1292 328V480H-40Z"></path>
              <path id="mountain-near" class="mountain mountain--near" d="M-40 390 40 338 110 358 186 306 254 352 328 293 400 344 480 286 548 348 626 300 710 353 790 287 868 346 948 301 1024 352 1100 305 1292 370V490H-40Z"></path>
              <path class="horizon-mist" d="M0 330c158-31 293 13 443-4s294-25 418-1 248 11 391-3v155H0Z"></path>

              <g class="forest-band" id="forest-0" aria-hidden="true">
                <path class="forest-shape" d="M0 386c45-27 78-36 120-8 43-39 83-35 124-5 39-47 86-38 124-7 49-42 90-32 133 3 40-35 85-37 126-3 43-44 90-36 132 1 48-43 91-35 132 2 45-42 87-34 128 1 43-32 89-32 133 1 45-39 90-31 126 0V576H0Z"></path>
                <path class="forest-glints"></path>
              </g>
              <g class="forest-band" id="forest-1" aria-hidden="true">
                <path class="forest-shape" d="M0 414c44-38 84-40 124-7 41-52 85-44 128-7 44-54 90-44 130-7 48-50 91-41 132-3 47-52 92-44 137-3 40-44 87-46 129-3 48-53 95-45 139-3 44-41 86-43 128-4 42-45 88-40 132 0 42-46 86-40 127 1V576H0Z"></path>
                <path class="forest-glints"></path>
              </g>
              <g class="forest-band" id="forest-2" aria-hidden="true">
                <path class="forest-shape" d="M0 448c38-47 83-51 124-9 40-59 86-48 128-8 40-55 87-49 132-8 47-58 94-50 136-5 43-58 90-50 137-5 44-51 88-55 133-5 45-58 93-49 136-5 46-52 89-51 130-5 45-57 90-48 135-2 39-43 82-48 125-2V576H0Z"></path>
                <path class="forest-glints"></path>
              </g>
              <g class="forest-band" id="forest-3" aria-hidden="true">
                <path class="forest-shape" d="M0 486c45-59 89-60 133-9 44-67 92-57 138-8 42-60 91-61 138-7 46-69 96-57 140-6 45-64 91-62 138-7 46-69 96-58 141-4 42-58 88-62 136-6 46-64 91-58 136-2 43-58 89-53 130-3 42-54 83-58 125-5V576H0Z"></path>
                <path class="forest-glints"></path>
              </g>
              <g class="forest-band" id="forest-4" aria-hidden="true">
                <path class="forest-shape" d="M0 530c41-69 87-72 132-10 45-78 92-67 139-8 45-73 94-69 143-7 45-77 94-67 141-7 43-70 90-72 139-5 47-77 94-64 142-5 45-70 91-69 138-4 46-69 91-60 134-1 42-60 87-60 124-4V576H0Z"></path>
                <path class="forest-glints"></path>
              </g>

              <g class="river">
                <path class="water" d="M0 408c145-20 266 6 398 0 139-7 236-24 369-5 146 20 288 2 485 4v169H0Z"></path>
                <g id="water-shimmers">
                  <path class="water-shimmer" d="M-50 439c130-13 257 13 388 1s252-8 390 8 280 6 578-12"></path>
                  <path class="water-shimmer water-shimmer--soft" d="M-50 478c166-14 278 16 435 1s282-8 424 9 274 3 494-13"></path>
                  <path class="water-shimmer water-shimmer--soft" d="M-50 531c154-11 292 14 446 2s318-12 476 6 271 4 430-10"></path>
                </g>
                <path class="riverbank" d="M0 413c137-12 255 10 393 5 83-3 144-18 229-11 101 8 159 22 246 12 119-14 230-20 384-4"></path>
              </g>

              <g class="bridge" id="bridge">
                <path class="bridge-hangers" id="bridge-hangers"></path>
                <path class="bridge-cable" d="M38 419C131 419 198 353 276 353c83 0 135 66 214 66 80 0 133-66 216-66 82 0 137 66 218 66 83 0 145-66 252-66 53 0 87 40 112 66"></path>
                <path class="bridge-tower" d="M270 419V345h12v74Zm424 0V345h12v74Z"></path>
                <path class="bridge-crossbeam" d="M261 360h30M261 379h30M685 360h30M685 379h30"></path>
                <path class="bridge-brace" d="m274 366 8 10m-8 9 8 10m412-29 8 10m-8 9 8 10"></path>
                <path class="bridge-deck" d="M34 416H1217v5H34z"></path>
                <path class="bridge-rail" d="M34 414H1217M34 428H1217"></path>
                <path class="bridge-posts" d="M86 414v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14m70-14v14"></path>
                <g id="train" class="train" filter="url(#train-soft)" aria-hidden="true">
                  <g class="train-body">
                    <path class="train-coupler" d="M6 407h7v3H6z"></path>
                    <path class="train-engine" d="M12 386h39l8 8v14H12z"></path>
                    <path class="train-cabin" d="M28 377h24l7 9H28z"></path>
                    <path class="train-window" d="M34 381h7v7h-7zm11 0h6v7h-6z"></path>
                    <path class="train-chimney" d="M18 380h7l2 6h-9z"></path>
                    <path class="train-light" d="M52 396h5v4h-5z"></path>
                    <path class="train-car" d="M66 388h44v20H66z"></path>
                    <path class="train-car train-car--second" d="M114 388h44v20h-44z"></path>
                    <path class="train-window train-window--car" d="M73 392h9v7h-9zm14 0h9v7h-9zm33 0h9v7h-9zm14 0h9v7h-9z"></path>
                    <path class="train-roof" d="M64 385h48v4H64zm48 0h48v4h-48z"></path>
                    <path class="train-link" d="M110 397h5v3h-5z"></path>
                    <g class="train-wheels" id="train-wheels">
                      <circle cx="27" cy="410" r="5"></circle><circle cx="49" cy="410" r="5"></circle>
                      <circle cx="78" cy="410" r="5"></circle><circle cx="101" cy="410" r="5"></circle>
                      <circle cx="126" cy="410" r="5"></circle><circle cx="149" cy="410" r="5"></circle>
                    </g>
                  </g>
                </g>
              </g>

              <path class="bank bank--left" d="M0 493c83-33 151-20 221 5 45 16 88 25 142 28v50H0Z"></path>
              <path class="bank bank--right" d="M1252 481c-78-20-144-1-218 26-34 12-73 20-121 25v44h339Z"></path>
              <path class="grass" d="m54 552 4-27m10 28 12-24m48 26-1-27m10 28 14-22m95 38 4-29m-9 30-12-22m102 29 4-26m101 20 11-22m31 23-2-30m10 31 14-23m91 23-3-29m13 30 14-22m129 18 5-30m10 30 14-23m132 15-3-31m10 31 14-23m84 15 2-28m9 28 14-22m89 18 4-29m10 29 16-23"></path>
            </g>
          </g>
        </svg>
        <div class="edge-light" aria-hidden="true"></div>
      </div>

      <aside class="parameter-panel" aria-labelledby="panel-title">
        <header class="panel-header">
          <div class="panel-heading">
            <p class="panel-eyebrow"><span class="live-dot"></span> LIVE LANDSCAPE</p>
            <h1 id="panel-title">场景参数</h1>
          </div>
          <span class="panel-index" aria-hidden="true">01 <i>/ 08</i></span>
        </header>

        <form class="control-grid" id="scene-controls" aria-label="动态景观参数">
          <label class="control" for="speed">
            <span class="control-name">行进速度</span>
            <input id="speed" name="speed" type="range" min="0.2" max="2.4" step="0.01" value="1.05" data-param="speed" aria-describedby="speed-value">
            <output class="control-value" id="speed-value" for="speed">1.05×</output>
          </label>
          <label class="control" for="zoom">
            <span class="control-name">视角缩放</span>
            <input id="zoom" name="zoom" type="range" min="0.82" max="1.28" step="0.01" value="1" data-param="zoom" aria-describedby="zoom-value">
            <output class="control-value" id="zoom-value" for="zoom">1.00×</output>
          </label>
          <label class="control" for="height">
            <span class="control-name">垂直位置</span>
            <input id="height" name="height" type="range" min="-84" max="84" step="1" value="0" data-param="height" aria-describedby="height-value">
            <output class="control-value" id="height-value" for="height">0 px</output>
          </label>
          <label class="control" for="clouds">
            <span class="control-name">云层浮动</span>
            <input id="clouds" name="clouds" type="range" min="0" max="1.8" step="0.01" value="0.8" data-param="clouds" aria-describedby="clouds-value">
            <output class="control-value" id="clouds-value" for="clouds">0.80×</output>
          </label>
          <label class="control" for="mountains">
            <span class="control-name">山峦起伏</span>
            <input id="mountains" name="mountains" type="range" min="0" max="1.6" step="0.01" value="0.78" data-param="mountains" aria-describedby="mountains-value">
            <output class="control-value" id="mountains-value" for="mountains">49%</output>
          </label>
          <label class="control" for="canopy">
            <span class="control-name">林冠繁茂</span>
            <input id="canopy" name="canopy" type="range" min="0.58" max="1.55" step="0.01" value="1.05" data-param="canopy" aria-describedby="canopy-value">
            <output class="control-value" id="canopy-value" for="canopy">108%</output>
          </label>
          <label class="control" for="detail">
            <span class="control-name">细节强度</span>
            <input id="detail" name="detail" type="range" min="0" max="1.4" step="0.01" value="0.58" data-param="detail" aria-describedby="detail-value">
            <output class="control-value" id="detail-value" for="detail">41%</output>
          </label>
          <label class="control" for="exposure">
            <span class="control-name">日光曝光</span>
            <input id="exposure" name="exposure" type="range" min="0.74" max="1.3" step="0.01" value="1" data-param="exposure" aria-describedby="exposure-value">
            <output class="control-value" id="exposure-value" for="exposure">1.00×</output>
          </label>
        </form>

        <footer class="panel-footer">
          <span class="panel-hint">DRAG TO SHAPE THE VIEW</span>
          <button class="reset-button" id="reset-controls" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4.2 7.1A6.2 6.2 0 1 1 4 12.4M4.2 3.8v3.7h3.7"></path></svg>
            <span>恢复默认</span>
          </button>
        </footer>
      </aside>
    </main>
  </body>
</html>
