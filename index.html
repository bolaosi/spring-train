<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#78aee0">
    <meta name="description" content="摄像机沿春日山林向左穿行的程序化动态景观。">
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <title>春野 · 山林穿行</title>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="./app.js"></script>
  </head>
  <body>
    <main class="experience" id="experience" aria-label="摄像机穿行中的春日山林">
      <div class="landscape-stage" aria-hidden="true">
        <svg class="landscape-fallback" viewBox="0 0 1252 576" preserveAspectRatio="xMidYMid slice" focusable="false" aria-hidden="true">
          <defs>
            <linearGradient id="fallback-sky" x2="0" y2="1">
              <stop stop-color="#78a9e1" />
              <stop offset="1" stop-color="#a6cbe2" />
            </linearGradient>
            <linearGradient id="fallback-cloud" x2="0" y2="1">
              <stop stop-color="#fbfcf8" stop-opacity=".84" />
              <stop offset="1" stop-color="#e6efee" stop-opacity=".54" />
            </linearGradient>
            <filter id="fallback-soft" x="-8%" y="-12%" width="116%" height="124%">
              <feGaussianBlur stdDeviation="2.2" />
            </filter>
            <linearGradient id="fallback-far" x2="0" y2="1">
              <stop stop-color="#b7cbbb" />
              <stop offset="1" stop-color="#819b8d" />
            </linearGradient>
            <linearGradient id="fallback-mid" x2="0" y2="1">
              <stop stop-color="#83ad89" />
              <stop offset="1" stop-color="#477856" />
            </linearGradient>
            <linearGradient id="fallback-near" x2="0" y2="1">
              <stop stop-color="#54875b" />
              <stop offset="1" stop-color="#214a35" />
            </linearGradient>
          </defs>
          <path fill="url(#fallback-sky)" d="M0 0h1252v576H0z" />
          <g fill="url(#fallback-cloud)" filter="url(#fallback-soft)">
            <path d="M-40 82c22-25 53-26 78-16 13-29 47-38 74-21 24-25 62-19 75 10 37-2 59 13 58 34-1 19-23 29-52 28l-203 4c-38 0-53-19-30-39zm462 16c22-20 55-22 79-8 18-34 55-43 84-19 21-32 66-32 85 3 31-7 67 6 69 33 2 20-21 31-55 31H442c-43 0-53-21-20-40zm641-39c20-19 48-20 70-8 15-25 46-31 68-13 22-21 53-12 60 11 30-3 52 10 51 28-1 19-23 26-49 25l-183-2c-32-1-39-22-17-41z" />
          </g>
          <g filter="url(#fallback-soft)">
            <path fill="#a9bdb4" d="M0 252 72 205l66 25 83-88 73 75 62-43 74 58 87-98 77 92 88-52 83 73 79-109 73 86 86-49 90 77 85-43 74 50v184H0z" />
            <path fill="#8fa89a" d="M0 286 92 236l71 29 94-62 70 57 87-45 82 63 87-74 76 62 74-53 86 68 93-87 81 66 82-43 114 56v173H0z" />
            <path fill="url(#fallback-far)" d="M0 286c38-19 55-16 78 8 21-48 65-59 99-29 22-53 68-67 103-29 27-41 64-37 87-1 26-52 80-59 112-18 32-46 77-42 105-2 28-52 76-58 108-17 28-44 72-47 103-8 29-41 69-38 94-3 31-45 77-34 104 2 31-34 75-34 103-4 27-37 65-24 82 5 37-24 64-9 72 18v315H0z" />
          </g>
          <path fill="url(#fallback-mid)" d="M0 366c39-32 63-29 94 3 20-56 73-63 109-20 28-63 79-70 118-20 31-58 78-63 111-11 36-46 90-51 126-7 35-57 91-59 127-7 34-47 76-44 106 4 36-55 87-55 117-5 37-45 79-35 104 18 36-36 88-29 115 6 31-38 72-32 92 5 32-41 78-25 83 23V576H0z" />
          <path fill="#356c49" d="M0 410c35-33 70-33 100 5 23-54 69-60 107-19 25-64 74-69 112-18 33-49 83-43 110 12 39-53 88-57 124-6 35-56 84-58 121-8 31-55 76-49 107 8 34-56 79-51 109 7 29-42 72-40 98 7 37-48 83-40 108 15 34-37 75-31 106 7 27-35 59-32 87 5v151H0z" />
          <g fill="none" stroke="#203a32" stroke-linecap="round" opacity=".53">
            <path stroke-width="1.7" d="M-20 315h1292M-20 319h1292" />
            <path stroke-width="1.1" d="M255 315q82-44 164 0m164 0q82-44 164 0m164 0q82-44 164 0" />
            <path stroke-width=".8" d="M255 315v-28m164 28v-28m164 28v-28m164 28v-28m164 28v-28m164 28v-28M275 300v15m20-21v21m20-24v24m20-21v21m20-15v15m184 0v15m20-21v21m20-24v24m20-21v21m20-15v15m184 0v15m20-21v21m20-24v24m20-21v21m20-15v15m184 0v15m20-21v21m20-24v24m20-21v21m20-15v15" />
          </g>
          <g transform="translate(224 304)" fill="#1b352d" stroke="#142b25" stroke-width="1">
            <path d="M0 0h13v-8h8l8 8h4v10H0z" />
            <path d="M34 2h18v8H34zm21 0h18v8H55z" fill="#294a3a" />
            <path d="M5-7h4v4H5zM15-6h4v5h-4z" fill="#d7e6ad" stroke="none" />
            <g fill="#172f28" stroke="none"><circle cx="7" cy="11" r="2.3"/><circle cx="21" cy="11" r="2.3"/><circle cx="40" cy="11" r="2.3"/><circle cx="62" cy="11" r="2.3"/></g>
          </g>
          <g filter="url(#fallback-soft)">
            <path fill="url(#fallback-near)" d="M0 463c31-63 83-75 128-23 33-88 102-98 149-19 34-86 102-97 152-20 40-74 109-74 151-7 52-88 125-90 176-6 37-78 99-77 140-2 47-74 114-68 151 10 37-68 97-60 126 23 39-55 86-44 114 28 31-40 69-27 88 24v125H0z" />
          </g>
        </svg>
        <canvas class="landscape" id="landscape" aria-label="蓝天下的春日森林、远山、悬索桥和一列小火车"></canvas>
      </div>

      <aside class="parameter-panel" aria-labelledby="panel-title">
        <header class="panel-header">
          <div class="panel-heading">
            <p class="panel-eyebrow"><span class="live-dot"></span> LIVE LANDSCAPE</p>
            <h1 id="panel-title">场景参数</h1>
          </div>
          <span class="panel-index" aria-hidden="true">01 <i>/ 08</i></span>
        </header>

        <noscript><p class="static-note">当前为静态预览；启用 JavaScript 后可播放动画并操作参数。</p></noscript>

        <form class="control-grid" id="scene-controls" aria-label="动态景观参数">
          <label class="control" for="speed">
            <span class="control-name">行进速度</span>
            <input id="speed" name="speed" type="range" min="0.2" max="2.4" step="0.01" value="1.05" data-param="speed" aria-describedby="speed-value">
            <output class="control-value" id="speed-value" for="speed">1.05×</output>
          </label>
          <label class="control" for="zoom">
            <span class="control-name">视角缩放</span>
            <input id="zoom" name="zoom" type="range" min="0.82" max="1.28" step="0.01" value="1" data-param="zoom" aria-describedby="zoom-value">
            <output class="control-value" id="zoom-value" for="zoom">1.00×</output>
          </label>
          <label class="control" for="height">
            <span class="control-name">垂直位置</span>
            <input id="height" name="height" type="range" min="-84" max="84" step="1" value="0" data-param="height" aria-describedby="height-value">
            <output class="control-value" id="height-value" for="height">0 px</output>
          </label>
          <label class="control" for="clouds">
            <span class="control-name">云朵起伏</span>
            <input id="clouds" name="clouds" type="range" min="0" max="1.8" step="0.01" value="0.8" data-param="clouds" aria-describedby="clouds-value">
            <output class="control-value" id="clouds-value" for="clouds">0.80×</output>
          </label>
          <label class="control" for="mountains">
            <span class="control-name">山峦起伏</span>
            <input id="mountains" name="mountains" type="range" min="0" max="1.6" step="0.01" value="0.78" data-param="mountains" aria-describedby="mountains-value">
            <output class="control-value" id="mountains-value" for="mountains">49%</output>
          </label>
          <label class="control" for="canopy">
            <span class="control-name">林冠繁茂</span>
            <input id="canopy" name="canopy" type="range" min="0.58" max="1.55" step="0.01" value="1.05" data-param="canopy" aria-describedby="canopy-value">
            <output class="control-value" id="canopy-value" for="canopy">48%</output>
          </label>
          <label class="control" for="detail">
            <span class="control-name">细节强度</span>
            <input id="detail" name="detail" type="range" min="0" max="1.4" step="0.01" value="0.58" data-param="detail" aria-describedby="detail-value">
            <output class="control-value" id="detail-value" for="detail">41%</output>
          </label>
          <label class="control" for="exposure">
            <span class="control-name">日光曝光</span>
            <input id="exposure" name="exposure" type="range" min="0.74" max="1.3" step="0.01" value="1" data-param="exposure" aria-describedby="exposure-value">
            <output class="control-value" id="exposure-value" for="exposure">1.00×</output>
          </label>
        </form>

        <footer class="panel-footer">
          <span class="panel-hint">DRAG TO SHAPE THE VIEW</span>
          <button class="reset-button" id="reset-controls" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4.2 7.1A6.2 6.2 0 1 1 4 12.4M4.2 3.8v3.7h3.7"></path></svg>
            <span>恢复默认</span>
          </button>
        </footer>
      </aside>
    </main>
  </body>
</html>
